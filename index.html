<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
    }

    /* BOTÓN DE MÚSICA */
    #botonMusica {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 9999;

      border: none;
      border-radius: 30px;
      padding: 14px 25px;

      background: rgba(255, 215, 0, 0.95);
      color: #3b2500;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.35);

      transition: 0.3s;
    }

    #botonMusica:hover {
      transform: translateX(-50%) scale(1.05);
    }

    #botonMusica:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* MENSAJE */
    #mensajeMusica {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);

      z-index: 9998;

      color: white;
      font-size: 14px;
      text-align: center;

      text-shadow: 0 2px 5px black;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="container"></div>

  <!-- MÚSICA -->
  <audio id="musica" preload="auto" loop>
    <source src="Entre tus brazos quiero quedarme.m4a.mp3" type="audio/mpeg">
    Tu navegador no puede reproducir este audio.
  </audio>

  <!-- BOTÓN -->
  <button id="botonMusica">▶️ Reproducir música</button>

  <div id="mensajeMusica"></div>

  <!-- THREE.JS -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from 'three';

    /* =========================
       MÚSICA
    ========================= */

    const musica = document.getElementById("musica");
    const botonMusica = document.getElementById("botonMusica");
    const mensajeMusica = document.getElementById("mensajeMusica");

    botonMusica.addEventListener("click", async () => {

      try {

        if (musica.paused) {

          await musica.play();

          botonMusica.innerHTML = "⏸️ Pausar música";
          mensajeMusica.innerHTML = "🎵 Reproduciendo...";

        } else {

          musica.pause();

          botonMusica.innerHTML = "▶️ Reproducir música";
          mensajeMusica.innerHTML = "Música pausada";

        }

      } catch (error) {

        console.error("Error al reproducir:", error);

        mensajeMusica.innerHTML =
          "No se pudo reproducir la música.";

      }

    });

    /* =========================
       ESCENA THREE.JS
    ========================= */

    const container = document.getElementById("container");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x02020a);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    camera.position.set(0, 0, 35);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    container.appendChild(renderer.domElement);

    /* =========================
       LUCES
    ========================= */

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      1
    );

    scene.add(ambientLight);

    /* =========================
       ESTRELLAS
    ========================= */

    const starsGeometry =
      new THREE.BufferGeometry();

    const starCount = 1800;

    const starPositions =
      new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {

      starPositions[i * 3] =
        (Math.random() - 0.5) * 250;

      starPositions[i * 3 + 1] =
        (Math.random() - 0.5) * 250;

      starPositions[i * 3 + 2] =
        (Math.random() - 0.5) * 250;

    }

    starsGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );

    const starsMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.35,
        transparent: true,
        opacity: 0.8
      });

    const stars =
      new THREE.Points(
        starsGeometry,
        starsMaterial
      );

    scene.add(stars);

    /* =========================
       GALAXIA
    ========================= */

    const galaxyGeometry =
      new THREE.BufferGeometry();

    const galaxyCount = 2500;

    const galaxyPositions =
      new Float32Array(galaxyCount * 3);

    for (let i = 0; i < galaxyCount; i++) {

      const radius =
        Math.random() * 35;

      const angle =
        radius * 0.35 +
        Math.random() * Math.PI * 2;

      galaxyPositions[i * 3] =
        Math.cos(angle) * radius;

      galaxyPositions[i * 3 + 1] =
        (Math.random() - 0.5) * 4;

      galaxyPositions[i * 3 + 2] =
        Math.sin(angle) * radius;

    }

    galaxyGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        galaxyPositions,
        3
      )
    );

    const galaxyMaterial =
      new THREE.PointsMaterial({
        color: 0xffd84d,
        size: 0.18,
        transparent: true,
        opacity: 0.75
      });

    const galaxy =
      new THREE.Points(
        galaxyGeometry,
        galaxyMaterial
      );

    scene.add(galaxy);

    /* =========================
       CORAZONES
    ========================= */

    const heartGroup =
      new THREE.Group();

    scene.add(heartGroup);

    function crearCorazon(x, y, z) {

      const shape =
        new THREE.Shape();

      shape.moveTo(0, 0);

      shape.bezierCurveTo(
        -0.5,
        -0.5,
        -1,
        0.3,
        0,
        1
      );

      shape.bezierCurveTo(
        1,
        0.3,
        0.5,
        -0.5,
        0,
        0
      );

      const geometry =
        new THREE.ShapeGeometry(shape);

      const material =
        new THREE.MeshBasicMaterial({
          color: 0xffd700,
          side: THREE.DoubleSide
        });

      const heart =
        new THREE.Mesh(
          geometry,
          material
        );

      heart.position.set(
        x,
        y,
        z
      );

      heart.scale.set(
        0.7,
        0.7,
        0.7
      );

      heartGroup.add(heart);
    }

    for (let i = 0; i < 25; i++) {

      crearCorazon(
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 20
      );

    }

    /* =========================
       TEXTO
    ========================= */

    const canvas =
      document.createElement("canvas");

    canvas.width = 1024;
    canvas.height = 256;

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#fff4a3";

    ctx.font =
      "bold 70px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "Para alguien muy especial ❤️",
      512,
      130
    );

    const texture =
      new THREE.CanvasTexture(canvas);

    const textMaterial =
      new THREE.SpriteMaterial({
        map: texture,
        transparent: true
      });

    const textSprite =
      new THREE.Sprite(
        textMaterial
      );

    textSprite.scale.set(
      22,
      5,
      1
    );

    textSprite.position.set(
      0,
      10,
      0
    );

    scene.add(textSprite);

    /* =========================
       IMÁGENES
    ========================= */

    const imagenes = [
      "4.png",
      "5.png",
      "6.png",
      "7.png",
      "8.png"
    ];

    const posiciones = [
      [-12, 5, 0],
      [12, 5, 0],
      [-14, -5, 0],
      [14, -5, 0],
      [0, -9, 0]
    ];

    const grupoImagenes =
      new THREE.Group();

    scene.add(grupoImagenes);

    imagenes.forEach(
      (archivo, index) => {

        const loader =
          new THREE.TextureLoader();

        loader.load(
          archivo,
          (texture) => {

            const material =
              new THREE.SpriteMaterial({
                map: texture,
                transparent: true
              });

            const sprite =
              new THREE.Sprite(material);

            sprite.scale.set(
              5,
              5,
              1
            );

            sprite.position.set(
              posiciones[index][0],
              posiciones[index][1],
              posiciones[index][2]
            );

            grupoImagenes.add(
              sprite
            );

          }
        );

      }
    );

    /* =========================
       ANIMACIÓN
    ========================= */

    const clock =
      new THREE.Clock();

    function animate() {

      requestAnimationFrame(
        animate
      );

      const tiempo =
        clock.getElapsedTime();

      stars.rotation.y =
        tiempo * 0.01;

      galaxy.rotation.y =
        tiempo * 0.03;

      heartGroup.rotation.y =
        tiempo * 0.15;

      grupoImagenes.rotation.y =
        tiempo * 0.08;

      textSprite.position.y =
        10 + Math.sin(tiempo) * 0.5;

      renderer.render(
        scene,
        camera
      );

    }

    animate();

    /* =========================
       AJUSTE DE PANTALLA
    ========================= */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
